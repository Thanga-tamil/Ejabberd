apiVersion: v1
kind: Service
metadata:
  name: {{ include "chatservice-headless.fullname" . }}-hl
  labels:
    {{- include "chatservice-headless.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ .Values.service.c2s.port }}
      targetPort: c2s
      protocol: TCP
      name: c2s
    - port: {{ .Values.service.s2s.port }}
      targetPort: s2s
      protocol: TCP
      name: s2s
  selector:
    {{- include "chatservice-headless.selectorLabels" . | nindent 4 }}
