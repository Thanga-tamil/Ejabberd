apiVersion: v1
kind: Service
metadata:
  name: {{ include "chatservice-headless.fullname" . }}
  labels:
    {{- include "chatservice-headless.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  loadBalancerIP: {{ .Values.ejabberd.staticIp | quote }}
  ports:
    - port: {{ .Values.service.c2s.port }}
      targetPort: c2s
      protocol: TCP
      name: c2s
    - port: {{ .Values.service.s2s.port }}
      targetPort: s2s
      protocol: TCP
      name: s2s
    - port: {{ .Values.service.http.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chatservice-headless.selectorLabels" . | nindent 4 }}
