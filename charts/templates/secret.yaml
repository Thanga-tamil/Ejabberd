apiVersion: v1
kind: Secret
metadata:
  name: {{ include "chatservice-headless.fullname" . }}-config
  labels:
    {{- include "chatservice-headless.labels" . | nindent 4 }}
type: Opaque
stringData:
  ejabberd.yml: |
    hosts:
      - "xmpp.tingmessenger.com"
    loglevel: 4
    log_rotate_size: 10485760
    log_rotate_date: ""
    log_rotate_count: 1
    log_rate_limit: 4000

    certfiles:
        - "/opt/ejabberd/certs/ejabberd.pem"

    define_macro:
      # TLS options for client not being able to use modern ciphers (Windows XP+, Android 3.0+)
      CIPHERS_INTERMEDIATE: "ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES256-SHA:ECDHE-ECDSA-DES-CBC3-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:DES-CBC3-SHA:!DSS"
      PROTOCOL_OPTIONS_INTERMEDIATE:
        - "no_sslv2"
        - "no_sslv3"

      # TLS options for client able to use modern ciphers (Windows 7+, Android 5.0+)
      CIPHERS_MODERN: "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256"
      PROTOCOL_OPTIONS_MODERN:
        - "no_sslv2"
        - "no_sslv3"
        - "no_tlsv1"
        - "no_tlsv1_1"

    c2s_ciphers: CIPHERS_INTERMEDIATE
    c2s_protocol_options: PROTOCOL_OPTIONS_INTERMEDIATE

    listen:
      -
        port: 5222
        ip: "::"
        module: ejabberd_c2s
        max_stanza_size: 3242888
        max_fsm_queue: 10000000
        shaper: c2s_shaper
        access: c2s
        starttls_required: true
      -
        port: 5269
        ip: "::"
        module: ejabberd_s2s_in
        max_stanza_size: 524288
      -
        port: 5280
        ip: "::"
        module: ejabberd_http
        request_handlers:
          "/api": mod_http_api
          #  "/bosh": mod_bosh
          #  "/upload": mod_http_upload
          "/websocket": ejabberd_http_ws
        web_admin: true
        captcha: true
        ciphers: CIPHERS_INTERMEDIATE
        protocol_options: PROTOCOL_OPTIONS_INTERMEDIATE
        #tls: false
        tls: true
        #  -
        #  port: 5280
        # ip: "::"
        #module: ejabberd_http
       # web_admin: true

     #-
      # port: 1883
      # ip: "::"
      # module: mod_mqtt
      # backlog: 1000

    s2s_use_starttls: optional

    auth_method: external
    extauth_program: "python3 /opt/ejabberd/MirrorFly.py"
    extauth_pool_size: 3
    auth_use_cache: false
    host_config:
      xmpp.tingmessenger.com:
        extauth_login_url: "api.tingmessenger.com/api/v1/login"
        sql_type: mysql
        sql_server: "{{ .Values.mysql.host }}"
        sql_database: "{{ .Values.mysql.database }}"
        sql_username: "{{ .Values.mysql.username }}"
        sql_password: "{{ .Values.mysql.password }}"
        sql_port: {{ .Values.mysql.port }}
        sql_pool_size: 10
        sql_keepalive_interval: 240

    acl:
      local:
        user_regexp: ""
      loopback:
        ip:
          - "192.168.0.0/24"
          - "::1/128"
      admin:
        user:
          - "123456789@xmpp.tingmessenger.com"
    access_rules:
      local:
        - allow: local
      c2s:
        - deny: blocked
        - allow
      announce:
        - allow: admin
      configure:
        - allow: admin
      muc_create:
        - allow: local
      pubsub_createnode:
        - allow: local
      register:
        - allow
      trusted_network:
        - allow

    api_permissions:
      "console commands":
        from:
          - ejabberd_ctl
        who: all
        what: "*"
      "admin access":
        who:
          - access:
              - allow:
                - acl: loopback
                - acl: admin
          - oauth:
            - scope: "ejabberd:admin"
            - access:
              - allow:
                - acl: loopback
                - acl: admin
        what:
          - "*"
          - "!stop"
          - "!start"
      "public commands":
        who:
          - all
        what:
          - "status"
          - "connected_users_number"
          - "connected_users"
          - "get_vcard"

    shaper:
      normal: 100000000
      fast: 500000000

    shaper_rules:
      max_user_sessions:
          - 2: admin
          - 3
      max_user_offline_messages:
        - 5000: admin
        - 1000
      c2s_shaper:
        - none: admin
        - normal
      s2s_shaper: fast

    registration_timeout: infinity
    modules:
      #  mod_adhoc: {}
      mod_admin_extra: {}
      #  mod_announce:
      #  access: announce
        #mod_avatar: {}
      mod_blocking: {}
      #mod_bosh: {}
      # mod_caps: {}
      mod_carboncopy: {}
      mod_client_state: {}
      #mod_configure: {}
      #mod_disco: {}
      #mod_fail2ban:
      #  c2s_auth_ban_lifetime: 7200
      #  c2s_max_auth_failures: 30
      mod_http_api: {}
      # mod_http_upload:
      #  put_url: "https://@HOST@:5443/upload"
      mod_last:
        db_type: sql
        use_cache: false
      mod_mam:
        ## Mnesia is limited to 2GB, better to use an SQL backend
        ## For small servers SQLite is a good fit and is very easy
        ## to configure. Uncomment this when you have SQL configured:
        db_type: sql
        assume_mam_usage: true
        default: always
      # mod_mqtt: {}
      # mod_muc:
      #  access:
      #    - allow
      #  access_admin:
      #    - allow: admin
      #  access_create: muc_create
      #  access_persistent: muc_create
      #  access_mam:
      #    - allow
      #  default_room_options:
      #    mam: true
      # mod_muc_admin: {}
      mod_offline:
        db_type: sql
        access_max_user_messages: max_user_offline_messages
      mod_ping:
        send_pings: true
        ping_interval: 10
        ping_ack_timeout: 15
        timeout_action: kill
      mod_privacy:
        db_type: sql
      mod_private: {}
      # mod_proxy65:
      #  access: local
      #  max_connections: 5
      mod_mix:
        db_type: sql
      mod_mix_pam:
        db_type: sql
        use_cache: true
      mod_pubsub:
        db_type: sql
        ignore_pep_from_offline: true
        last_item_cache: false
        access_createnode: pubsub_createnode
       # plugins:
         # - "flat"
         # - "hometree"
         # - "pep"
        force_node_config:
          ## Change from "whitelist" to "open" to enable OMEMO support
          ## See https://github.com/processone/ejabberd/issues/2425
          "eu.siacs.conversations.axolotl.*":
            access_model: open
          ## Avoid buggy clients to make their bookmarks public
          "storage:bookmarks":
            access_model: whitelist
     ## mod_push: {}
     ## mod_push_keepalive: {}
      #mod_register:
        ## Only accept registration requests from the "trusted"
        ## network (see access_rules section above).
        ## Think twice before enabling registration from any
        ## address. See the Jabber SPAM Manifesto for details:
        ## https://github.com/ge0rg/jabber-spam-fighting-manifesto
       # ip_access: trusted_network
      mod_roster:
        db_type: sql
        versioning: true
        use_cache: false
     # mod_s2s_dialback: {}
     # mod_shared_roster:
     #   db_type: sql
      #mod_stream_mgmt:
      #  resend_on_timeout: if_offline
      mod_vcard:
        use_cache: false
        db_type: sql
        search: false
      mod_vcard_xupdate: {}
     # mod_version:
     #   show_os: false

    ####################################
    #### Custom modules from contus ####
    ####################################

      fly_mod_stanza_ack: {}
      fly_add_timestamp: {}
      fly_mod_user_fav: {}
      fly_mix_group_chat: {}
      fly_mod_offline_web: {}
      fly_mod_media: {}
      fly_mod_offline_push:
            rabbitmq_host: "{{ .Values.rabbitmq.host }}"
            rabbitmq_exchange: "{{ .Values.rabbitmq.exchange }}"
            rabbitmq_username: "{{ .Values.rabbitmq.username }}"
            rabbitmq_password: "{{ .Values.rabbitmq.password }}"
    append_host_config:
      ## Add some modules to vhost one:
      xmpp.tingmessenger.com:
        modules:
          fly_mod_user_activities:
            client_key: "{{ .Values.client.key }}"
            client_name: xmpp.tingmessenger.com

    ### Local Variables:
    ### mode: yaml
    ### End:
    ### vim: set fi letype=yaml tabstop=8

  ejabberdctl.cfg: |
    #
    # In this file you can configure options that are passed by ejabberdctl
    # to the erlang runtime system when starting ejabberd
    #

    #' POLL: Kernel polling ([true|false])
    #
    # The kernel polling option requires support in the kernel.
    # Additionally, you need to enable this feature while compiling Erlang.
    #
    # Default: true
    #
    #POLL=true

    #.
    #' SMP: SMP support ([enable|auto|disable])
    #
    # Explanation in Erlang/OTP documentation:
    # enable: starts the Erlang runtime system with SMP support enabled.
    #   This may fail if no runtime system with SMP support is available.
    # auto: starts the Erlang runtime system with SMP support enabled if it
    #   is available and more than one logical processor are detected.
    # disable: starts a runtime system without SMP support.
    #
    # Default: auto
    #
    #SMP=auto

    #.
    #' ERL_MAX_PORTS: Maximum number of simultaneously open Erlang ports
    #
    # ejabberd consumes two or three ports for every connection, either
    # from a client or from another Jabber server. So take this into
    # account when setting this limit.
    #
    # Default: 65536 (or 8196 on Windows)
    # Maximum: 268435456
    #
    ERL_MAX_PORTS=7000000

    #.
    #' FIREWALL_WINDOW: Range of allowed ports to pass through a firewall
    #
    # If Ejabberd is configured to run in cluster, and a firewall is blocking ports,
    # it's possible to make Erlang use a defined range of port (instead of dynamic
    # ports) for node communication.
    #
    # Default: not defined
    # Example: 4200-4210
    #
    #FIREWALL_WINDOW=

    #.
    #'  INET_DIST_INTERFACE: IP address where this Erlang node listens other nodes
    #
    # This communication is used by ejabberdctl command line tool,
    # and in a cluster of several ejabberd nodes.
    #
    # Default: 0.0.0.0
    #
    #INET_DIST_INTERFACE=127.0.0.1

    #.
    #' ERL_EPMD_ADDRESS: IP addresses where epmd listens for connections
    #
    # This environment variable may be set to a comma-separated
    # list of IP addresses, in which case the epmd daemon
    # will listen only on the specified address(es) and on the
    # loopback address (which is implicitly added to the list if it
    # has not been specified). The default behaviour is to listen on
    # all available IP addresses.
    #
    # Default: 0.0.0.0
    #
    #ERL_EPMD_ADDRESS=127.0.0.1

    #.
    #' ERL_PROCESSES: Maximum number of Erlang processes
    #
    # Erlang consumes a lot of lightweight processes. If there is a lot of activity
    # on ejabberd so that the maximum number of processes is reached, people will
    # experience greater latency times. As these processes are implemented in
    # Erlang, and therefore not related to the operating system processes, you do
    # not have to worry about allowing a huge number of them.
    #
    # Default: 262144
    # Maximum: 268435456
    #
    ERL_PROCESSES=17000000

    #.
    #' ERL_MAX_ETS_TABLES: Maximum number of ETS and Mnesia tables
    #
    # The number of concurrent ETS and Mnesia tables is limited. When the limit is
    # reached, errors will appear in the logs:
    #   ** Too many db tables **
    # You can safely increase this limit when starting ejabberd. It impacts memory
    # consumption but the difference will be quite small.
    #
    # Default: 2053
    #
    ERL_MAX_ETS_TABLES=5000

    #.
    #' ERL_OPTIONS: Additional Erlang options
    #
    # The next variable allows to specify additional options passed to erlang while
    # starting ejabberd. Some useful options are -noshell, -detached, -heart. When
    # ejabberd is started from an init.d script options -noshell and -detached are
    # added implicitly. See erl(1) for more info.
    #
    # It might be useful to add "-pa /usr/local/lib/ejabberd/ebin" if you
    # want to add local modules in this path.
    #
    # Default: ""
    #
    #ERL_OPTIONS=""

    #.
    #' ERLANG_NODE: Erlang node name
    #
    # The next variable allows to explicitly specify erlang node for ejabberd
    # It can be given in different formats:
    # ERLANG_NODE=ejabberd
    #   Lets erlang add hostname to the node (ejabberd uses short name in this case)
    # ERLANG_NODE=ejabberd@hostname
    #   Erlang uses node name as is (so make sure that hostname is a real
    #   machine hostname or you'll not be able to control ejabberd)
    # ERLANG_NODE=ejabberd@hostname.domainname
    #   The same as previous, but erlang will use long hostname
    #   (see erl (1) manual for details)
    #
    # Default: ejabberd@localhost
    #
    #ERLANG_NODE=ejabberd@localhost

    #.
    #' EJABBERD_PID_PATH: ejabberd PID file
    #
    # Indicate the full path to the ejabberd Process identifier (PID) file.
    # If this variable is defined, ejabberd writes the PID file when starts,
    # and deletes it when stops.
    # Remember to create the directory and grant write permission to ejabberd.
    #
    # Default: don't write PID file
    #
    #EJABBERD_PID_PATH=/var/run/ejabberd/ejabberd.pid

    #.
    #' EJABBERD_CONFIG_PATH: ejabberd configuration file
    #
    # Specify the full path to the ejabberd configuration file. If the file name has
    # yml or yaml extension, it is parsed as a YAML file; otherwise, Erlang syntax is
    # expected.
    #
    # Default: $ETC_DIR/ejabberd.yml
    #
    #EJABBERD_CONFIG_PATH=/etc/ejabberd/ejabberd.yml

    #.
    #' CONTRIB_MODULES_PATH: contributed ejabberd modules path
    #
    # Specify the full path to the contributed ejabberd modules. If the path is not
    # defined, ejabberd will use ~/.ejabberd-modules in home of user running ejabberd.
    #
    # Default: $HOME/.ejabberd-modules
    #
    #CONTRIB_MODULES_PATH=/opt/ejabberd-modules

    #.
    #' CONTRIB_MODULES_CONF_DIR: configuration directory for contributed modules
    #
    # Specify the full path to the configuration directory for contributed ejabberd
    # modules. In order to configure a module named mod_foo, a mod_foo.yml file can
    # be created in this directory. This file will then be used instead of the
    # default configuration file provided with the module.
    #
    # Default: $CONTRIB_MODULES_PATH/conf
    #
    #CONTRIB_MODULES_CONF_DIR=/etc/ejabberd/modules

    #.
    #'
    # vim: foldmarker=#',#. foldmethod=marker:

  inetrc: |
    {lookup,["file","native"]}.
    {host,{127,0,0,1}, ["localhost","hostalias"]}.
    {file, resolv, "/etc/resolv.conf"}.

