# Default values for chatservice-headless.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 3

image:
  repository: asia-south1-docker.pkg.dev/ting-messenger/tm-artifact-registry/tm-backend-ejabberd-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "e720da5de5b4f2f03c447c42165211015d5ea8a4"
#imagePullSecrets:
#   - name: nexus-secret
#nameOverride: ""
#fullnameOverride: ""
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
tls:
  secretName: domain-tls-gateway
podAnnotations: {}
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  type: LoadBalancer
  c2s:
    port: 5222
  s2s:
    port: 5269
  http:
    port: 5280
ingress:
  enabled: false
  className: ""
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls:
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 15
    memory: 40Gi
  requests:
    cpu: 14
    memory: 32Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70
nodeSelector:
  nodepool/environment: production
tolerations:
- key: "nodepool/environment"
  operator: "Equal"
  value: "production"
  effect: "NoSchedule"
affinity: {}
rabbitmq:
  host: "rabbitmq"
  exchange: "fly_notification"
  username: "mirrorfly"
  password: ""
mysql:
  host: "mysql"
  database: "app_core"
  username: "tm-user"
  password: ""
  port: 3306
client:
  key: ""
  url: "api.tingmessenger.com"
ejabberd:
  staticIp: ""

extraEnv:
- name: ERL_MAX_PORTS
  value: "1000000"

- name: ERL_MAX_ETS_TABLES
  value: "1000000"
